version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 容器镜像的基础镜像（按 digest 固定）/ The container image's base image (pinned by digest)
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # 编辑器里的正则由面板照内核编译（crates/panel-server/src/regex_check.rs），这三个要和最新的内核（tuoro/kixdns 的 main）
    # 的 Cargo.lock 一样（CI 每次比一遍，scripts/check-kernel-regex-versions.py），只跟着内核一起改。
    # The panel compiles the editor's regexes as the kernel does (crates/panel-server/src/regex_check.rs), so these three
    # must equal those in the latest kernel's (tuoro/kixdns main) Cargo.lock (CI compares them on every run,
    # scripts/check-kernel-regex-versions.py); they move only together with the kernel.
    ignore:
      - dependency-name: regex
      - dependency-name: regex-automata
      - dependency-name: regex-syntax

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # @types/node 的主版本跟着 CI 固定的 Node（24）走，换 Node 主版本时一起改
      # @types/node's major follows the Node pinned in CI (24) and moves together with it
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # vue-tsc 用 TypeScript 的 JS 编译器 API（typescript/lib/tsc），TypeScript 7 是原生编译器、没有这套 API，等 vue-tsc 支持了再升
      # vue-tsc runs on TypeScript's JS compiler API (typescript/lib/tsc), which TypeScript 7, a native compiler, does not ship;
      # it moves once vue-tsc supports it
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
