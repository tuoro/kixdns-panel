version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # 这些主版本需要与固定的 Node 24 和 Vue 构建链统一迁移。
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-vue"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: vue-router
        update-types:
          - version-update:semver-major
      # vue-tsc 3.3.12 把 v-for 里组件静态属性中的「//」（占位提示里的网址）当成注释开头，
      # 循环变量随之丢失，类型检查误报（vuejs/language-tools#6240）。只跳过这一版，修好的版本照常升。
      - dependency-name: vue-tsc
        versions:
          - "3.3.12"
