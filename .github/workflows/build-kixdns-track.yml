name: Build KixDNS track

on:
  workflow_call:
    inputs:
      catalog_directory:
        description: Verified upstream lock catalog
        required: true
        type: string
      force:
        description: Rebuild every catalog entry
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    name: Find missing packages
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.catalog.outputs.count }}
      locks: ${{ steps.catalog.outputs.locks }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable patchsets
        env:
          PATCHSET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/verify-patchsets.sh "$PATCHSET_BASE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Select catalog entries to build
        id: catalog
        shell: bash
        env:
          CATALOG_DIRECTORY: ${{ inputs.catalog_directory }}
          # PR 也按完整输入指纹查库存；只有手动调度可以要求全量重建。
          FORCE_BUILD: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CATALOG_DIRECTORY" =~ ^upstreams/(actions|releases)$ ]] || {
            echo "版本目录无效：$CATALOG_DIRECTORY" >&2
            exit 1
          }
          mapfile -t catalog < <(find "$CATALOG_DIRECTORY" -maxdepth 1 -type f -name '*.json' -print | sort -r)
          ((${#catalog[@]} > 0)) || { echo '版本目录为空' >&2; exit 1; }

          threshold="$(date -u -d '+7 days' '+%Y-%m-%dT%H:%M:%SZ')"
          selected=()
          for lock_file in "${catalog[@]}"; do
            if [[ "$FORCE_BUILD" == true ]]; then
              selected+=("$lock_file")
              continue
            fi
            missing=false
            for architecture in x86_64 arm64; do
              artifact="$(bash scripts/kixdns-artifact-identity.sh "$lock_file" "$architecture")"
              response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}&per_page=10")"
              if ! jq -e --arg threshold "$threshold" \
                '[.artifacts[] | select(.expired == false and .expires_at > $threshold)] | length > 0' \
                <<< "$response" >/dev/null; then
                missing=true
                break
              fi
            done
            [[ "$missing" == true ]] && selected+=("$lock_file")
          done

          locks="$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          [[ "$locks" != '[]' ]] || locks='[""]'
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "locks=$locks" >> "$GITHUB_OUTPUT"
          echo "需要构建 ${#selected[@]} / ${#catalog[@]} 个上游版本"

  verify:
    name: Verify ${{ matrix.lock_file }}
    if: needs.inventory.outputs.count != '0'
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lock_file: ${{ fromJSON(needs.inventory.outputs.locks) }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Cache enhanced build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            .upstream/* -> target

      - name: Verify build tooling
        run: |
          cargo fmt --all -- --check
          cargo test --package xtask --locked
          cargo clippy --package xtask --all-targets --locked -- -D warnings

      - name: Prepare enhanced source
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          cargo xtask prepare --lock "$LOCK_FILE"
          echo "UPSTREAM_DIR=.upstream/kixdns-$(jq -r .source "$LOCK_FILE")-$(jq -r .commit "$LOCK_FILE" | cut -c1-12)-p$(jq -r .patchset "$LOCK_FILE")" >> "$GITHUB_ENV"

      - name: Verify enhanced source
        run: |
          cd "$UPSTREAM_DIR"
          cargo fmt --check
          cargo test --lib --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo audit --deny warnings

      - name: Verify enhanced runtime contract
        run: |
          cd "$UPSTREAM_DIR"
          cargo build --locked
          python3 "$GITHUB_WORKSPACE/scripts/dns_smoke.py" target/debug/kixdns

  build:
    name: Build ${{ matrix.lock_file }} / ${{ matrix.platform.arch }}
    if: github.event_name != 'pull_request' && needs.inventory.outputs.count != '0'
    needs: [inventory, verify]
    runs-on: ${{ matrix.platform.runner }}
    container:
      image: ubuntu:22.04
    env:
      GLIBC_BASELINE: "2.35"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lock_file: ${{ fromJSON(needs.inventory.outputs.locks) }}
        platform:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cmake curl git jq perl pkg-config python3 zstd
          rm -rf /var/lib/apt/lists/*

      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.platform.target }}

      - name: Cache enhanced build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            .upstream/* -> target

      - name: Prepare enhanced source
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          cargo xtask prepare --lock "$LOCK_FILE"
          echo "UPSTREAM_DIR=.upstream/kixdns-$(jq -r .source "$LOCK_FILE")-$(jq -r .commit "$LOCK_FILE" | cut -c1-12)-p$(jq -r .patchset "$LOCK_FILE")" >> "$GITHUB_ENV"

      - name: Export build identity
        id: identity
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          artifact="$(bash scripts/kixdns-artifact-identity.sh "$LOCK_FILE" "${{ matrix.platform.arch }}")"
          {
            echo "KIXDNS_UPSTREAM_COMMIT=$(jq -r .commit "$LOCK_FILE")"
            echo "KIXDNS_PANEL_PATCHSET=$(jq -r .patchset "$LOCK_FILE")"
            echo "ARTIFACT_NAME=${artifact}"
          } >> "$GITHUB_ENV"
          echo "artifact_name=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --manifest-path "$UPSTREAM_DIR/Cargo.toml" --release --locked --target ${{ matrix.platform.target }}

      - name: Verify GLIBC baseline
        run: bash scripts/verify-glibc-baseline.sh "$UPSTREAM_DIR/target/${{ matrix.platform.target }}/release/kixdns" "$GLIBC_BASELINE"

      - name: Package enhanced artifact
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          enhanced="dist/${ARTIFACT_NAME}"
          capabilities="patches/sets/${KIXDNS_PANEL_PATCHSET}/capabilities.json"
          checksum_inputs=(kixdns upstream.lock.json)
          install -Dm755 "$UPSTREAM_DIR/target/${{ matrix.platform.target }}/release/kixdns" "$enhanced/kixdns"
          cp "$LOCK_FILE" "$enhanced/upstream.lock.json"
          if [[ -f "$capabilities" ]]; then
            cp "$capabilities" "$enhanced/KIXDNS_CAPABILITIES.json"
            checksum_inputs+=(KIXDNS_CAPABILITIES.json)
          fi
          printf '%s\n' "$GITHUB_SHA" > "$enhanced/KIXDNS_BUILD_COMMIT"
          checksum_inputs+=(KIXDNS_BUILD_COMMIT)
          (cd "$enhanced" && sha256sum "${checksum_inputs[@]}" > SHA256SUMS)

      - name: Upload enhanced artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: dist/${{ steps.identity.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 90
