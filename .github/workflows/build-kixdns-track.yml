name: Build KixDNS track

on:
  workflow_call:
    inputs:
      catalog_directory:
        description: Verified upstream lock catalog
        required: true
        type: string
      force:
        description: Rebuild every catalog entry
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    name: Find missing packages
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.catalog.outputs.count }}
      locks: ${{ steps.catalog.outputs.locks }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable patchsets
        env:
          PATCHSET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/verify-patchsets.sh "$PATCHSET_BASE_SHA"

      - name: Verify patchset sealing rules
        run: bash scripts/test-verify-patchsets.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Verify artifact identity boundary
        run: bash scripts/test-kixdns-artifact-identity.sh

      - name: Verify upstream Action selection
        run: bash scripts/test-select-kixdns-action-run.sh

      - name: Select catalog entries to build
        id: catalog
        shell: bash
        env:
          CATALOG_DIRECTORY: ${{ inputs.catalog_directory }}
          # PR 也按完整输入指纹查库存；只有手动调度可以要求全量重建。
          FORCE_BUILD: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CATALOG_DIRECTORY" =~ ^upstreams/(actions|releases)$ ]] || {
            echo "版本目录无效：$CATALOG_DIRECTORY" >&2
            exit 1
          }
          mapfile -t catalog < <(find "$CATALOG_DIRECTORY" -maxdepth 1 -type f -name '*.json' -print | sort -r)
          ((${#catalog[@]} > 0)) || { echo '版本目录为空' >&2; exit 1; }

          threshold="$(date -u -d '+7 days' '+%Y-%m-%dT%H:%M:%SZ')"
          selected=()
          for lock_file in "${catalog[@]}"; do
            if [[ "$FORCE_BUILD" == true ]]; then
              selected+=("$lock_file")
              continue
            fi
            missing=false
            for architecture in x86_64 arm64; do
              artifact="$(bash scripts/kixdns-artifact-identity.sh "$lock_file" "$architecture")"
              response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact}&per_page=10")"
              if ! jq -e --arg threshold "$threshold" \
                '[.artifacts[] | select(.expired == false and .expires_at > $threshold)] | length > 0' \
                <<< "$response" >/dev/null; then
                missing=true
                break
              fi
            done
            [[ "$missing" == true ]] && selected+=("$lock_file")
          done

          locks="$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          [[ "$locks" != '[]' ]] || locks='[""]'
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "locks=$locks" >> "$GITHUB_OUTPUT"
          echo "需要构建 ${#selected[@]} / ${#catalog[@]} 个上游版本"

  verify:
    name: Verify ${{ matrix.lock_file }}
    if: needs.inventory.outputs.count != '0'
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lock_file: ${{ fromJSON(needs.inventory.outputs.locks) }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # 从源码编译 cargo-audit 每次约 2 分 45 秒，且早于缓存恢复、从不命中；改装 RustSec 发布的预编译包，
      # 版本不变并校验 SHA-256。fallback: none 让预编译包缺失时直接失败，而不是悄悄退回源码编译。
      # Compiling cargo-audit took ~2m45s on every run, before any cache restore; install RustSec's
      # prebuilt release at the same version with its SHA-256 checked. fallback: none fails loudly
      # instead of silently compiling from source again when no prebuilt binary exists.
      - name: Install dependency auditor
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Cache enhanced build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            . -> target
            .upstream/* -> target

      - name: Verify build tooling
        run: |
          cargo fmt --all -- --check
          cargo test --package xtask --locked
          cargo clippy --package xtask --all-targets --locked -- -D warnings

      - name: Prepare enhanced source
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          cargo xtask prepare --lock "$LOCK_FILE"
          upstream_dir="$(cargo xtask checkout-dir --lock "$LOCK_FILE")"
          echo "UPSTREAM_DIR=${upstream_dir}" >> "$GITHUB_ENV"

      - name: Verify enhanced source
        run: |
          cd "$UPSTREAM_DIR"
          cargo fmt --check
          cargo test --lib --locked
          cargo test --bin kixdns --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo audit --deny warnings

      - name: Verify enhanced runtime contract
        run: |
          cd "$UPSTREAM_DIR"
          cargo build --locked
          python3 "$GITHUB_WORKSPACE/scripts/dns_smoke.py" target/debug/kixdns

      # 每个版本各自留一个「已验证」标记，构建只认自己那一版的标记。
      # build 对 verify 矩阵的 needs 是整体的：只要一个版本验证失败，所有版本的构建都会被跳过，
      # 一个带新公告的旧版本就能让当前版本也建不出来。标记把这种连带拆开。
      # Each catalog entry leaves its own "verified" marker and each build only trusts its own.
      # needs on the verify matrix is all-or-nothing: one failing entry skips every build, so a
      # single old entry hit by a new advisory would stop the current one from being built too.
      - name: Record verified entry
        id: marker
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          sha256sum "$LOCK_FILE" > "$RUNNER_TEMP/verified/lock.sha256"
          echo "name=kernel-verified-${LOCK_FILE//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload verified marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ${{ runner.temp }}/verified/lock.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    name: Build ${{ matrix.lock_file }} / ${{ matrix.platform.arch }}
    # 不随整个 verify 矩阵的成败决定：每个版本在下面核对自己的验证标记。
    # Not gated on the verify matrix as a whole: each entry checks its own marker below.
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.inventory.result == 'success' &&
      needs.inventory.outputs.count != '0'
    needs: [inventory, verify]
    runs-on: ${{ matrix.platform.runner }}
    container:
      image: ubuntu:22.04
    # 容器里的 run 步骤默认用 sh，不认 [[ ]] 和 ${var//x/y}；整个构建作业统一用 bash。
    # Inside a container, run steps default to sh, which rejects [[ ]] and ${var//x/y};
    # the whole build job uses bash instead.
    defaults:
      run:
        shell: bash
    env:
      GLIBC_BASELINE: "2.35"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lock_file: ${{ fromJSON(needs.inventory.outputs.locks) }}
        platform:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cmake curl git jq perl pkg-config python3 zstd
          rm -rf /var/lib/apt/lists/*

      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate verified marker
        id: marker
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: echo "name=kernel-verified-${LOCK_FILE//\//-}" >> "$GITHUB_OUTPUT"

      # 这个版本没有通过验证时标记不存在，下载失败，只有这一版的构建失败。
      # Without a passing verification the marker does not exist, the download fails,
      # and only this entry's build fails.
      - name: Require this entry to be verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ${{ runner.temp }}/verified

      - name: Check verified lock
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          expected="$(cut -d ' ' -f1 "$RUNNER_TEMP/verified/lock.sha256")"
          actual="$(sha256sum "$LOCK_FILE" | cut -d ' ' -f1)"
          [[ -n "$expected" && "$expected" == "$actual" ]] || {
            echo "验证标记与锁文件不一致：$LOCK_FILE" >&2
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.platform.target }}

      - name: Cache enhanced build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            . -> target
            .upstream/* -> target

      - name: Prepare enhanced source
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          cargo xtask prepare --lock "$LOCK_FILE"
          upstream_dir="$(cargo xtask checkout-dir --lock "$LOCK_FILE")"
          echo "UPSTREAM_DIR=${upstream_dir}" >> "$GITHUB_ENV"

      - name: Export build identity
        id: identity
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          artifact="$(bash scripts/kixdns-artifact-identity.sh "$LOCK_FILE" "${{ matrix.platform.arch }}")"
          {
            echo "KIXDNS_UPSTREAM_COMMIT=$(jq -r .commit "$LOCK_FILE")"
            echo "KIXDNS_PANEL_PATCHSET=$(jq -r .patchset "$LOCK_FILE")"
            echo "ARTIFACT_NAME=${artifact}"
          } >> "$GITHUB_ENV"
          echo "artifact_name=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --manifest-path "$UPSTREAM_DIR/Cargo.toml" --release --locked --target ${{ matrix.platform.target }}

      - name: Verify GLIBC baseline
        run: bash scripts/verify-glibc-baseline.sh "$UPSTREAM_DIR/target/${{ matrix.platform.target }}/release/kixdns" "$GLIBC_BASELINE"

      - name: Package enhanced artifact
        shell: bash
        env:
          LOCK_FILE: ${{ matrix.lock_file }}
        run: |
          enhanced="dist/${ARTIFACT_NAME}"
          capabilities="patches/sets/${KIXDNS_PANEL_PATCHSET}/capabilities.json"
          checksum_inputs=(kixdns upstream.lock.json)
          install -Dm755 "$UPSTREAM_DIR/target/${{ matrix.platform.target }}/release/kixdns" "$enhanced/kixdns"
          cp "$LOCK_FILE" "$enhanced/upstream.lock.json"
          if ((KIXDNS_PANEL_PATCHSET >= 8)); then
            [[ -f "$capabilities" ]] || {
              echo "补丁集 p${KIXDNS_PANEL_PATCHSET} 缺少能力清单" >&2
              exit 1
            }
          fi
          if [[ -f "$capabilities" ]]; then
            jq -e '
              .schema_version == 1 and
              (.config_capabilities | type == "array") and
              ([.config_capabilities[] | type == "string" and test("^[a-z][a-z0-9_]{0,63}$")] | all) and
              ((.config_capabilities | unique | length) == (.config_capabilities | length))
            ' "$capabilities" >/dev/null
            cp "$capabilities" "$enhanced/KIXDNS_CAPABILITIES.json"
            checksum_inputs+=(KIXDNS_CAPABILITIES.json)
          fi
          printf '%s\n' "$GITHUB_SHA" > "$enhanced/KIXDNS_BUILD_COMMIT"
          checksum_inputs+=(KIXDNS_BUILD_COMMIT)
          (cd "$enhanced" && sha256sum "${checksum_inputs[@]}" > SHA256SUMS)

      - name: Upload enhanced artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: dist/${{ steps.identity.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 90
