name: Build KixDNS Enhanced

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/build-kixdns.yml
      - .github/workflows/build-kixdns-track.yml
      - .github/workflows/sync-upstream.yml
      - patches/**
      - scripts/dns_smoke.py
      - scripts/verify-glibc-baseline.sh
      - scripts/verify-patchsets.sh
      - tools/xtask/**
      - Cargo.lock
      - scripts/kixdns-artifact-identity.sh
      - scripts/lock-reference.sh
      - scripts/test-kixdns-artifact-identity.sh
      - scripts/test-verify-patchsets.sh
      - scripts/report-kernel-build.sh
      - scripts/test-report-kernel-build.sh
      - scripts/select-kixdns-action-run.sh
      - scripts/test-select-kixdns-action-run.sh
      - upstreams/actions/**
      - upstream.lock.json
      - rust-toolchain.toml
  pull_request:
    paths:
      - .github/workflows/build-kixdns.yml
      - .github/workflows/build-kixdns-track.yml
      - .github/workflows/sync-upstream.yml
      - patches/**
      - scripts/dns_smoke.py
      - scripts/verify-glibc-baseline.sh
      - scripts/verify-patchsets.sh
      - tools/xtask/**
      - Cargo.lock
      - scripts/kixdns-artifact-identity.sh
      - scripts/lock-reference.sh
      - scripts/test-kixdns-artifact-identity.sh
      - scripts/test-verify-patchsets.sh
      - scripts/report-kernel-build.sh
      - scripts/test-report-kernel-build.sh
      - scripts/select-kixdns-action-run.sh
      - scripts/test-select-kixdns-action-run.sh
      - upstreams/actions/**
      - upstream.lock.json
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all catalog versions
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: kixdns-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 只有 report 作业用到 issues: write，用来开关构建失败告警。
    # Only the report job uses issues: write, to open and close the build failure alert.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/build-kixdns-track.yml
    with:
      catalog_directory: upstreams/actions
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
