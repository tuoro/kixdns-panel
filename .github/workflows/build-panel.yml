name: Build KixDNS Panel

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/build-panel.yml
      - crates/panel-server/**
      - crates/panel-helper/**
      - deploy/**
      - scripts/fetch-kixdns-release.sh
      - scripts/fetch-builtin-geosite.sh
      - scripts/verify-geosite.py
      - scripts/kixdns-artifact-identity.sh
      - scripts/lock-reference.sh
      - scripts/install.sh
      - scripts/one-click-install.sh
      - scripts/panel-online-update.sh
      - scripts/package_acceptance.py
      - scripts/test-one-click-install.sh
      - scripts/test-install-policy.sh
      - scripts/test-uninstall-policy.sh
      - scripts/test-unit-name-rule.sh
      - scripts/test-package-acceptance.sh
      - scripts/verify-glibc-baseline.sh
      - scripts/uninstall.sh
      - web/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths:
      - .github/workflows/build-panel.yml
      - crates/panel-server/**
      - crates/panel-helper/**
      - deploy/**
      - scripts/fetch-kixdns-release.sh
      - scripts/fetch-builtin-geosite.sh
      - scripts/verify-geosite.py
      - scripts/kixdns-artifact-identity.sh
      - scripts/lock-reference.sh
      - scripts/install.sh
      - scripts/one-click-install.sh
      - scripts/panel-online-update.sh
      - scripts/package_acceptance.py
      - scripts/test-one-click-install.sh
      - scripts/test-install-policy.sh
      - scripts/test-uninstall-policy.sh
      - scripts/test-unit-name-rule.sh
      - scripts/test-package-acceptance.sh
      - scripts/verify-glibc-baseline.sh
      - scripts/uninstall.sh
      - web/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # 发布内核（日期版本）的仓库；完整安装包带它的一个版本。
  # The repository that publishes kernels (date versions); the full package carries one of them.
  KIXDNS_KERNEL_REPOSITORY: tuoro/kixdns

concurrency:
  group: panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Pick KixDNS kernel release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 一次运行只挑一次版本：两个架构的构建分头取内核，各自去问「最新」会在中间赶上新发布。
      # 在 PR 上也跑一遍，取内核的脚本不用等合并才第一次执行。
      # Pick the version once per run: the two architecture builds fetch the kernel separately, and
      # asking each for "latest" could straddle a new release. It runs on pull requests too, so the
      # fetch script does not first execute after the merge.
      - name: Pick and verify the latest kernel release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(gh api "repos/${KIXDNS_KERNEL_REPOSITORY}/releases/latest" --jq .tag_name)"
          for architecture in x86_64 arm64; do
            bash scripts/fetch-kixdns-release.sh \
              "$KIXDNS_KERNEL_REPOSITORY" "$version" "$architecture" "dist/kernel-$architecture"
          done
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  geosite:
    name: Pick built-in GeoSite
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.pick.outputs.release }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 和内核一样一次运行只挑一次版本，两个架构的包带同一份；PR 上也跑一遍取文件和检查。
      # Like the kernel, pick the release once per run so both architectures carry the same file; pull
      # requests run the fetch and its checks too.
      - name: Pick and verify the latest GeoSite release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release="$(gh api repos/Loyalsoldier/v2ray-rules-dat/releases/latest --jq .tag_name)"
          bash scripts/fetch-builtin-geosite.sh "$release" dist/builtin-geo
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify panel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify release identity
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kixdns-panel-server") | .version')"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache panel build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target

      - name: Verify panel server
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      # 这里平时靠 rust-cache 里的 ~/.cargo/bin 跳过编译，Cargo.lock 一变缓存失效就要重编约 2 分 45 秒；
      # 预编译包让两种情况都只需几秒，版本不变并校验 SHA-256。
      # rust-cache's ~/.cargo/bin usually skips the build here, but any Cargo.lock change misses the cache
      # and recompiles for ~2m45s; the prebuilt binary takes seconds either way, same version, SHA-256 checked.
      - name: Install dependency auditor
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit panel dependencies
        run: cargo audit --deny warnings

      - name: Verify design tokens
        run: bash scripts/check-design-tokens.sh

      - name: Verify web console
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build

      # 前端 e2e 只在 PR 改了 web/ 或这个 workflow 时跑；发布和手动触发照跑全套。
      # 推到 main 的提交在 PR 上已经按合并后的结果测过，不再重跑；只改 Rust、脚本、锁文件的 PR 也不跑。
      # 用变量接住 git diff 再判断：管道接 grep -q 时，文件名多到写满管道缓冲，git 会被 SIGPIPE 打断，pipefail 下误判成没改。
      - name: Decide whether web acceptance tests run
        id: acceptance
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            release|workflow_dispatch) run=true ;;
            pull_request)
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
              changed="$(git diff --name-only "$BASE_SHA" HEAD -- web .github/workflows/build-panel.yml)"
              if [[ -n "$changed" ]]; then run=true; else run=false; fi
              ;;
            *) run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Web acceptance tests: $run"

      - name: Resolve Playwright version
        if: steps.acceptance.outputs.run == 'true'
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: steps.acceptance.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser for web acceptance tests
        if: steps.acceptance.outputs.run == 'true'
        working-directory: web
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify web workflows
        if: steps.acceptance.outputs.run == 'true'
        working-directory: web
        run: npm run test:e2e

      - name: Upload web acceptance report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: panel-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint deployment scripts
        shell: bash
        run: shellcheck scripts/*.sh

      - name: Verify installation policy
        shell: bash
        run: bash scripts/test-install-policy.sh

      - name: Verify one-click installer policy
        shell: bash
        run: bash scripts/test-one-click-install.sh

      - name: Verify uninstallation policy
        shell: bash
        run: bash scripts/test-uninstall-policy.sh

      - name: Verify systemd unit-name rule matches panel-server
        shell: bash
        run: bash scripts/test-unit-name-rule.sh

      - name: Verify upstream lock catalog
        shell: bash
        run: |
          catalog="upstreams/actions/$(jq -r .official_run_id upstream.lock.json).json"
          cmp --silent upstream.lock.json "$catalog"
          for architecture in x86_64 arm64; do
            [[ "$(bash scripts/kixdns-artifact-identity.sh upstream.lock.json "$architecture")" == \
              "$(bash scripts/kixdns-artifact-identity.sh "$catalog" "$architecture")" ]]
          done

      - name: Verify panel-only fingerprint stability
        shell: bash
        run: |
          identities_before="$(
            for architecture in x86_64 arm64; do
              bash scripts/kixdns-artifact-identity.sh upstream.lock.json "$architecture"
            done
          )"
          cargo_lock_backup="$(mktemp)"
          cp -- Cargo.lock "$cargo_lock_backup"
          trap 'cp -- "$cargo_lock_backup" Cargo.lock; rm -f -- "$cargo_lock_backup"' EXIT
          printf '\n# panel-only dependency change\n' >> Cargo.lock
          identities_after="$(
            for architecture in x86_64 arm64; do
              bash scripts/kixdns-artifact-identity.sh upstream.lock.json "$architecture"
            done
          )"
          [[ "$identities_before" == "$identities_after" ]]

  build:
    name: Build Linux ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    needs: [kernel, geosite, verify]
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    env:
      GLIBC_BASELINE: "2.35"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cmake curl gh git jq perl pkg-config python3 unzip zip zstd
          rm -rf /var/lib/apt/lists/*

      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache panel build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build panel server
        run: cargo build --package kixdns-panel-server --release --locked --target ${{ matrix.target }}

      - name: Build service control helper
        run: cargo build --package kixdns-panel-helper --release --locked --target ${{ matrix.target }}

      - name: Fetch verified KixDNS kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          KIXDNS_KERNEL_VERSION: ${{ needs.kernel.outputs.version }}
        run: |
          bash scripts/fetch-kixdns-release.sh \
            "$KIXDNS_KERNEL_REPOSITORY" "$KIXDNS_KERNEL_VERSION" "${{ matrix.arch }}" dist/kixdns-kernel

      - name: Fetch built-in GeoSite
        env:
          GH_TOKEN: ${{ github.token }}
          GEOSITE_RELEASE: ${{ needs.geosite.outputs.release }}
        run: bash scripts/fetch-builtin-geosite.sh "$GEOSITE_RELEASE" dist/builtin-geo

      - name: Verify GLIBC baseline
        run: |
          bash scripts/verify-glibc-baseline.sh \
            "target/${{ matrix.target }}/release/kixdns-panel-server" "$GLIBC_BASELINE"
          bash scripts/verify-glibc-baseline.sh \
            "target/${{ matrix.target }}/release/kixdns-panel-helper" "$GLIBC_BASELINE"
          bash scripts/verify-glibc-baseline.sh \
            dist/kixdns-kernel/kixdns "$GLIBC_BASELINE"

      - name: Package complete panel artifact
        shell: bash
        run: |
          bundle="dist/kixdns-panel-linux-${{ matrix.arch }}"
          install -Dm755 dist/kixdns-kernel/kixdns "$bundle/bin/kixdns"
          install -Dm755 "target/${{ matrix.target }}/release/kixdns-panel-server" "$bundle/bin/kixdns-panel-server"
          install -Dm755 "target/${{ matrix.target }}/release/kixdns-panel-helper" "$bundle/bin/kixdns-panel-helper"
          mkdir -p "$bundle/web" "$bundle/docs" "$bundle/geo"
          cp -a web/dist/. "$bundle/web/"
          install -m 0644 dist/builtin-geo/geosite.dat dist/builtin-geo/geosite.json \
            dist/builtin-geo/LICENSE "$bundle/geo/"
          cp -a deploy scripts "$bundle/"
          cp docs/architecture.md docs/config-capabilities.md docs/control-protocol-v1.md \
            docs/deployment.md "$bundle/docs/"
          cp README.md LICENSE "$bundle/"
          cp dist/kixdns-kernel/KIXDNS_BUILD_COMMIT dist/kixdns-kernel/KIXDNS_SOURCE.json \
            dist/kixdns-kernel/KIXDNS_ARTIFACT_ID dist/kixdns-kernel/KIXDNS_ARTIFACT_NAME \
            dist/kixdns-kernel/KIXDNS_ARTIFACT_DIGEST dist/kixdns-kernel/KIXDNS_BINARY_SHA256 \
            dist/kixdns-kernel/KIXDNS_CAPABILITIES.json "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/PANEL_BUILD_COMMIT"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            printf '%s\n' "${GITHUB_REF_NAME}" > "$bundle/PANEL_RELEASE"
          fi
          checksum_file="$(mktemp)"
          trap 'rm -f "$checksum_file"' EXIT
          (
            cd "$bundle"
            while IFS= read -r -d '' file; do
              sha256sum "$file"
            done < <(find . -type f ! -name SHA256SUMS -print0 | sort -z)
          ) > "$checksum_file"
          mv "$checksum_file" "$bundle/SHA256SUMS"
          trap - EXIT
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            (cd dist && zip -qr "kixdns-panel-linux-${{ matrix.arch }}.zip" "kixdns-panel-linux-${{ matrix.arch }}")
          fi

      - name: Upload complete panel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-linux-${{ matrix.arch }}
          path: dist/kixdns-panel-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      - name: Stage release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-release-${{ matrix.arch }}
          path: dist/kixdns-panel-linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Accept packaged installation
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Download x86_64 panel package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kixdns-panel-linux-x86_64
          path: dist/kixdns-panel

      - name: Verify package installation and runtime
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            bash dist/kixdns-panel/scripts/test-package-acceptance.sh

  publish:
    name: Publish panel release
    if: github.event_name == 'release'
    needs: [build, acceptance]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kixdns-panel-release-*
          path: dist
          merge-multiple: true

      - name: Upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(dist/*.zip)
          [[ ${#packages[@]} -eq 2 ]]
          gh release upload "${GITHUB_REF_NAME}" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
