name: Build KixDNS Panel

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/build-panel.yml
      - crates/panel-server/**
      - crates/panel-helper/**
      - deploy/**
      - scripts/fetch-kixdns-release.sh
      - scripts/package-openwrt.sh
      - scripts/test-openwrt-package.sh
      - scripts/package-docker.sh
      - scripts/test-docker-image.sh
      - scripts/npm-audit.py
      - scripts/test-npm-audit.py
      - scripts/check-kernel-regex-versions.py
      - scripts/test-kernel-regex-versions.py
      - scripts/fetch-builtin-geosite.sh
      - scripts/verify-geosite.py
      - scripts/install.sh
      - scripts/one-click-install.sh
      - scripts/panel-online-update.sh
      - scripts/package_acceptance.py
      - scripts/test-one-click-install.sh
      - scripts/test-install-policy.sh
      - scripts/test-uninstall-policy.sh
      - scripts/test-unit-name-rule.sh
      - scripts/test-package-acceptance.sh
      - scripts/verify-glibc-baseline.sh
      - scripts/uninstall.sh
      - tools/kernel-config-check/**
      - web/**
      - testdata/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths:
      - .github/workflows/build-panel.yml
      - crates/panel-server/**
      - crates/panel-helper/**
      - deploy/**
      - scripts/fetch-kixdns-release.sh
      - scripts/package-openwrt.sh
      - scripts/test-openwrt-package.sh
      - scripts/package-docker.sh
      - scripts/test-docker-image.sh
      - scripts/npm-audit.py
      - scripts/test-npm-audit.py
      - scripts/check-kernel-regex-versions.py
      - scripts/test-kernel-regex-versions.py
      - scripts/fetch-builtin-geosite.sh
      - scripts/verify-geosite.py
      - scripts/install.sh
      - scripts/one-click-install.sh
      - scripts/panel-online-update.sh
      - scripts/package_acceptance.py
      - scripts/test-one-click-install.sh
      - scripts/test-install-policy.sh
      - scripts/test-uninstall-policy.sh
      - scripts/test-unit-name-rule.sh
      - scripts/test-package-acceptance.sh
      - scripts/verify-glibc-baseline.sh
      - scripts/uninstall.sh
      - tools/kernel-config-check/**
      - web/**
      - testdata/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # 发布内核（日期版本）的仓库；完整安装包带它的一个版本。
  # The repository that publishes kernels (date versions); the full package carries one of them.
  KIXDNS_KERNEL_REPOSITORY: tuoro/kixdns

concurrency:
  group: panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Pick KixDNS kernel release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 一次运行只挑一次版本：两个架构的构建分头取内核，各自去问「最新」会在中间赶上新发布。
      # 在 PR 上也跑一遍，取内核的脚本不用等合并才第一次执行。
      # Pick the version once per run: the two architecture builds fetch the kernel separately, and
      # asking each for "latest" could straddle a new release. It runs on pull requests too, so the
      # fetch script does not first execute after the merge.
      - name: Pick and verify the latest kernel release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(gh api "repos/${KIXDNS_KERNEL_REPOSITORY}/releases/latest" --jq .tag_name)"
          # glibc 版给完整包，musl 版给 OpenWrt 安装包 / glibc for the full package, musl for the OpenWrt package
          for architecture in x86_64 arm64; do
            for libc in gnu musl; do
              bash scripts/fetch-kixdns-release.sh \
                "$KIXDNS_KERNEL_REPOSITORY" "$version" "$architecture" "dist/kernel-$architecture-$libc" "$libc"
            done
          done
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  geosite:
    name: Pick built-in GeoSite
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.pick.outputs.release }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 和内核一样一次运行只挑一次版本，两个架构的包带同一份；PR 上也跑一遍取文件和检查。
      # Like the kernel, pick the release once per run so both architectures carry the same file; pull
      # requests run the fetch and its checks too.
      - name: Pick and verify the latest GeoSite release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release="$(gh api repos/Loyalsoldier/v2ray-rules-dat/releases/latest --jq .tag_name)"
          bash scripts/fetch-builtin-geosite.sh "$release" dist/builtin-geo
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify panel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 面板照内核写的编译器和测试用的执行器一起写错时，只有真内核看得出来（回答条件的 GeoSite 类型名就这样被拒了好几个版本）。
      # 开发照最新的内核（内核仓库的 main）：这次运行时 main 指到哪个提交就取哪个提交的源码，锁文件也用它的，下面编
      # tools/kernel-config-check 逐份校验面板编出的配置。打包的内核只管首次安装，面板跟着内核更新走
      # When the panel's compiler and the test executor, both written after the kernel, share a mistake, only the real kernel can tell
      # (the answer check's GeoSite type name was refused for several releases that way). Development follows the latest kernel (main of
      # the kernel repository): the commit main points at when this run starts is fetched, with its own lock file, so
      # tools/kernel-config-check below validates the panel's compiled configs one by one. The bundled kernel is only for first
      # installs; the panel follows kernel updates
      - name: Resolve the latest kernel (main)
        id: kernel-main
        shell: bash
        run: |
          commit="$(git ls-remote "https://github.com/${KIXDNS_KERNEL_REPOSITORY}" refs/heads/main | cut -f1)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'KixDNS main：%s\n' "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout the latest kernel (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIXDNS_KERNEL_REPOSITORY }}
          ref: ${{ steps.kernel-main.outputs.commit }}
          path: .upstream/kixdns
          persist-credentials: false

      - name: Use the latest kernel's lock file
        run: cp .upstream/kixdns/Cargo.lock tools/kernel-config-check/Cargo.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify release identity
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kixdns-panel-server") | .version')"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 校验工具自己一个工作区，一起缓存：内核没换依赖时只重编内核这一个包 / The check tool is a workspace of its own, cached alongside: when
      # the kernel keeps its dependencies only the kernel crate itself is rebuilt
      - name: Cache panel build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: |
            . -> target
            tools/kernel-config-check -> target

      - name: Verify panel server
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build kernel config check
        run: |
          cargo fmt --manifest-path tools/kernel-config-check/Cargo.toml -- --check
          cargo build --manifest-path tools/kernel-config-check/Cargo.toml

      # 编辑器里的正则由面板照内核编译一遍（crates/panel-server/src/regex_check.rs），回答要和最新的内核（main）一样，正则库就得是
      # 它用的那一版：拿上面取下来的 main（.upstream/kixdns）的 Cargo.lock，比一比 regex、regex-automata、regex-syntax。
      # The panel compiles the editor's regexes as the kernel does (crates/panel-server/src/regex_check.rs); to answer as the
      # latest kernel (main) does, the regex crates must be the ones it uses: compare regex, regex-automata and regex-syntax with
      # the Cargo.lock of the main fetched above (.upstream/kixdns).
      - name: Verify the regex crates match the latest kernel (main)
        run: |
          python3 -I scripts/test-kernel-regex-versions.py
          python3 -I scripts/check-kernel-regex-versions.py Cargo.lock .upstream/kixdns/Cargo.lock

      # 这里平时靠 rust-cache 里的 ~/.cargo/bin 跳过编译，Cargo.lock 一变缓存失效就要重编约 2 分 45 秒；
      # 预编译包让两种情况都只需几秒，版本不变并校验 SHA-256。
      # rust-cache's ~/.cargo/bin usually skips the build here, but any Cargo.lock change misses the cache
      # and recompiles for ~2m45s; the prebuilt binary takes seconds either way, same version, SHA-256 checked.
      - name: Install dependency auditor
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit panel dependencies
        run: cargo audit --deny warnings

      - name: Verify design tokens
        run: bash scripts/check-design-tokens.sh

      - name: Verify web console
        working-directory: web
        run: |
          npm ci
          # 例外表里逐条写着理由；用不上的例外也会失败（scripts/npm-audit.py）
          # Each exception in the allowlist states its reason; an unused one fails too (scripts/npm-audit.py)
          python3 -I ../scripts/test-npm-audit.py
          python3 -I ../scripts/npm-audit.py npm-audit-allow.txt
          npm test
          npm run build

      # 示例配置、每一种条件和结果、每一种上游写法、高级规则编辑器的每一种类型，再加按种子生成的一批（kernel-fixtures.test.ts），
      # 拿最新的内核（main）的 config::validate 逐份校验，有一份不收就失败。基础设置页的检查（settings-kernel-fixtures.test.ts）也交给它：
      # 页面说不收的设置要正好是内核拒的原因里说到的那几项，页面不说的内核要收
      # The samples, every condition and outcome kind, every way of writing an upstream, every type of the advanced rule editor and a
      # seeded batch (kernel-fixtures.test.ts), each validated by the latest kernel's (main) config::validate; any refusal fails the job.
      # The settings page's checks (settings-kernel-fixtures.test.ts) go to it too: the settings the page refuses must be exactly those
      # the kernel's reasons speak of, and what the page lets through the kernel must accept
      - name: Check compiled configs with the latest kernel (main)
        shell: bash
        env:
          KERNEL_FIXTURES: ${{ runner.temp }}/kernel-fixtures.json
          KERNEL_SETTINGS_FIXTURES: ${{ runner.temp }}/kernel-settings-fixtures.json
        run: |
          (cd web && npx vitest run src/config-model/kernel-fixtures.test.ts src/config-editor/settings-kernel-fixtures.test.ts)
          tools/kernel-config-check/target/debug/kernel-config-check < "$KERNEL_FIXTURES"
          tools/kernel-config-check/target/debug/kernel-config-check < "$KERNEL_SETTINGS_FIXTURES"

      # 内核报的配置问题和提醒带着代号，面板按代号说中文（web/src/kernel-sayings.ts）。最新的内核（main）的代号和参数名
      # （kixdns::notice::CODES）由检查工具写出来，面板的中文表要正好覆盖它们，参数名对得上，多了少了都失败
      # The kernel's configuration problems and warnings carry codes, which the panel says in Chinese (web/src/kernel-sayings.ts). The
      # check tool writes out the codes and argument names of the latest kernel (main) (kixdns::notice::CODES), and the panel's Chinese
      # table has to cover them exactly with matching argument names, failing on any more or fewer
      - name: Check the panel's words for every message code of the latest kernel (main)
        shell: bash
        env:
          KERNEL_MESSAGE_CODES: ${{ runner.temp }}/kernel-message-codes.json
        run: |
          tools/kernel-config-check/target/debug/kernel-config-check --message-codes > "$KERNEL_MESSAGE_CODES"
          (cd web && npx vitest run src/kernel-sayings.test.ts)

      - name: Lint deployment scripts
        shell: bash
        run: shellcheck scripts/*.sh deploy/openwrt/*.sh deploy/openwrt/init/*.init

      - name: Verify installation policy
        shell: bash
        run: bash scripts/test-install-policy.sh

      - name: Verify one-click installer policy
        shell: bash
        run: bash scripts/test-one-click-install.sh

      - name: Verify uninstallation policy
        shell: bash
        run: bash scripts/test-uninstall-policy.sh

      - name: Verify systemd unit-name rule matches panel-server
        shell: bash
        run: bash scripts/test-unit-name-rule.sh

  # 前端 e2e 只在 PR 改了 web/ 或这个 workflow 时跑；发布和手动触发照跑全套。
  # 推到 main 的提交在 PR 上已经按合并后的结果测过，不再重跑；只改 Rust、脚本、锁文件的 PR 也不跑。
  # PR 上检出的是 GitHub 把 PR 合进当前 main 的合并提交：第一个父提交就是当前 main，只和它比才是这个 PR 自己的改动。
  # 和 pull_request.base.sha 比不行：它停在 PR 开出来时的 main，main 之后改过 web/ 或这个 workflow，每个旧 PR 都会被误判成改了。
  # 用变量接住 git diff 再判断：管道接 grep -q 时，文件名多到写满管道缓冲，git 会被 SIGPIPE 打断，pipefail 下误判成没改。
  # Web e2e runs only when a PR changes web/ or this workflow; releases and manual runs run it all.
  # Pushes to main were tested as merged on their PR and are not run again; PRs touching only Rust, scripts or lock files skip it.
  # A PR run checks out GitHub's merge of the PR into the current main: its first parent is that main, so only comparing against it
  # gives this PR's own changes. pull_request.base.sha does not: it stays at main as of when the PR was opened, so once main
  # changes web/ or this workflow every older PR would be taken as changing them.
  # git diff goes into a variable before the test: piped into grep -q, a long file list fills the pipe buffer, git dies of SIGPIPE
  # and pipefail reads that as no change.
  e2e-scope:
    name: Decide web acceptance tests
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.acceptance.outputs.run }}
    steps:
      - name: Checkout the merge commit and its parents
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether web acceptance tests run
        id: acceptance
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            release|workflow_dispatch) run=true ;;
            pull_request)
              changed="$(git diff --name-only HEAD^1 HEAD -- web .github/workflows/build-panel.yml)"
              if [[ -n "$changed" ]]; then run=true; else run=false; fi
              ;;
            *) run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Web acceptance tests: $run"

  # 一份跑全部用例要十几分钟，拆成 4 份并行，每份照旧 4 个 worker（playwright.config.ts）。fullyParallel 下按用例拆，4 份各约 170 个。
  # e2e 用 Vite 开发服务器的演示模式，不用编 Rust，所以单独成 job、不跟 Verify panel 抢时间。
  # One run of every test takes over ten minutes, so it is split into 4 parallel shards, each still with 4 workers
  # (playwright.config.ts). With fullyParallel the split is per test, about 170 each. The e2e tests use the Vite dev server in demo
  # mode and need no Rust build, so they are a job of their own instead of lengthening Verify panel.
  e2e:
    name: Verify web workflows (${{ matrix.shard }}/4)
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser for web acceptance tests
        working-directory: web
        shell: bash
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify web workflows
        working-directory: web
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload web acceptance report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: panel-playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build Linux ${{ matrix.arch }}
    # e2e 推到 main 时不跑（跳过），发布时跑：跳过照常构建，跑了就要通过；上游失败或取消都不构建
    # e2e is skipped on pushes to main and runs on releases: a skip still builds, a run has to pass; any failed or cancelled
    # upstream job stops the build
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.kernel.result == 'success' && needs.geosite.result == 'success' && needs.verify.result == 'success'
      && needs.e2e-scope.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    needs: [kernel, geosite, verify, e2e-scope, e2e]
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    env:
      GLIBC_BASELINE: "2.35"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      # Ubuntu 的源在同步时会短暂给出大小对不上的索引（v4.4.1 发版时 security.ubuntu.com 就让这一步连败两次，「Mirror sync
      # in progress?」），几分钟后自己好：update 失败隔一分钟再来，最多三次；下载包的网络抖动交给 apt 自己重试。
      # Ubuntu mirrors briefly serve index files of the wrong size while they sync (security.ubuntu.com failed this step twice in a
      # row during the v4.4.1 release, "Mirror sync in progress?") and recover within minutes: a failed update waits a minute and
      # tries again, three times at most; network blips while downloading packages are left to apt's own retries.
      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            apt-get update && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt-get update failed (attempt $attempt), retrying in 60 s"
            sleep 60
          done
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            binutils build-essential ca-certificates cmake curl gh git jq perl pkg-config python3 unzip zip zstd
          rm -rf /var/lib/apt/lists/*

      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache panel build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: . -> target

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build panel server
        run: cargo build --package kixdns-panel-server --release --locked --target ${{ matrix.target }}

      - name: Build service control helper
        run: cargo build --package kixdns-panel-helper --release --locked --target ${{ matrix.target }}

      - name: Fetch verified KixDNS kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          KIXDNS_KERNEL_VERSION: ${{ needs.kernel.outputs.version }}
        run: |
          bash scripts/fetch-kixdns-release.sh \
            "$KIXDNS_KERNEL_REPOSITORY" "$KIXDNS_KERNEL_VERSION" "${{ matrix.arch }}" dist/kixdns-kernel

      - name: Fetch built-in GeoSite
        env:
          GH_TOKEN: ${{ github.token }}
          GEOSITE_RELEASE: ${{ needs.geosite.outputs.release }}
        run: bash scripts/fetch-builtin-geosite.sh "$GEOSITE_RELEASE" dist/builtin-geo

      - name: Verify GLIBC baseline
        run: |
          bash scripts/verify-glibc-baseline.sh \
            "target/${{ matrix.target }}/release/kixdns-panel-server" "$GLIBC_BASELINE"
          bash scripts/verify-glibc-baseline.sh \
            "target/${{ matrix.target }}/release/kixdns-panel-helper" "$GLIBC_BASELINE"
          bash scripts/verify-glibc-baseline.sh \
            dist/kixdns-kernel/kixdns "$GLIBC_BASELINE"

      - name: Package complete panel artifact
        shell: bash
        run: |
          bundle="dist/kixdns-panel-linux-${{ matrix.arch }}"
          install -Dm755 dist/kixdns-kernel/kixdns "$bundle/bin/kixdns"
          install -Dm755 "target/${{ matrix.target }}/release/kixdns-panel-server" "$bundle/bin/kixdns-panel-server"
          install -Dm755 "target/${{ matrix.target }}/release/kixdns-panel-helper" "$bundle/bin/kixdns-panel-helper"
          mkdir -p "$bundle/web" "$bundle/docs" "$bundle/geo"
          cp -a web/dist/. "$bundle/web/"
          install -m 0644 dist/builtin-geo/geosite.dat dist/builtin-geo/geosite.json \
            dist/builtin-geo/LICENSE "$bundle/geo/"
          cp -a deploy scripts "$bundle/"
          cp docs/architecture.md docs/config-capabilities.md docs/control-protocol-v1.md \
            docs/deployment.md "$bundle/docs/"
          cp README.md LICENSE "$bundle/"
          cp dist/kixdns-kernel/KIXDNS_BUILD_COMMIT dist/kixdns-kernel/KIXDNS_SOURCE.json \
            dist/kixdns-kernel/KIXDNS_ARTIFACT_ID dist/kixdns-kernel/KIXDNS_ARTIFACT_NAME \
            dist/kixdns-kernel/KIXDNS_ARTIFACT_DIGEST dist/kixdns-kernel/KIXDNS_BINARY_SHA256 \
            dist/kixdns-kernel/KIXDNS_CAPABILITIES.json "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/PANEL_BUILD_COMMIT"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            printf '%s\n' "${GITHUB_REF_NAME}" > "$bundle/PANEL_RELEASE"
          fi
          checksum_file="$(mktemp)"
          trap 'rm -f "$checksum_file"' EXIT
          (
            cd "$bundle"
            while IFS= read -r -d '' file; do
              sha256sum "$file"
            done < <(find . -type f ! -name SHA256SUMS -print0 | sort -z)
          ) > "$checksum_file"
          mv "$checksum_file" "$bundle/SHA256SUMS"
          trap - EXIT
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            (cd dist && zip -qr "kixdns-panel-linux-${{ matrix.arch }}.zip" "kixdns-panel-linux-${{ matrix.arch }}")
          fi

      - name: Upload complete panel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-linux-${{ matrix.arch }}
          path: dist/kixdns-panel-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      - name: Stage release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-release-${{ matrix.arch }}
          path: dist/kixdns-panel-linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  # OpenWrt（procd、musl）是正式支持的平台：面板和服务助手要能编成 musl 静态二进制。glibc 的构建只在合并以后跑，这里
  # PR 上也跑，只在 musl 上才出现的编译问题在合并前就能看到。两个架构都在原生 runner 上编，C 依赖（ring、bundled
  # SQLite）用 Ubuntu 的 musl-tools 编，不需要交叉工具链。
  # OpenWrt (procd, musl) is a supported platform: the panel and the service helper must build as static musl binaries. The glibc
  # build runs only after a merge; this one runs on pull requests too, so a compile failure that only shows on musl is seen before
  # merging. Both architectures build on native runners, and the C dependencies (ring, bundled SQLite) build with Ubuntu's
  # musl-tools, so no cross toolchain is needed.
  build-musl:
    name: Build Linux ${{ matrix.arch }} (musl)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      # 源同步时的索引错误同上面 glibc 构建，一样隔一分钟重试 / Mirror-sync index errors as in the glibc build above, retried a minute apart
      - name: Install musl toolchain
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt-get update failed (attempt $attempt), retrying in 60 s"
            sleep 60
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 musl-tools

      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache panel build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: . -> target

      - name: Build panel server and service control helper
        run: |
          cargo build --package kixdns-panel-server --package kixdns-panel-helper \
            --release --locked --target ${{ matrix.target }}

      # OpenWrt 上没有 glibc 的动态加载器：二进制里不能有 PT_INTERP，能在 runner 上直接跑起来才算编对了
      # OpenWrt has no glibc dynamic loader: the binaries must carry no PT_INTERP, and running them on the runner shows the build is sound
      - name: Verify static musl binaries
        shell: bash
        run: |
          for binary in kixdns-panel-server kixdns-panel-helper; do
            path="target/${{ matrix.target }}/release/${binary}"
            if readelf --program-headers --wide "$path" | grep -q 'INTERP'; then
              printf '%s 不是静态链接 / is not statically linked\n' "$binary" >&2
              exit 1
            fi
            "$path" --help > /dev/null
          done

      # 给在 OpenWrt 上试 PR 的人直接拿去用，不进 Release / For anyone trying a pull request on OpenWrt; not part of a release
      - name: Upload musl binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-linux-${{ matrix.arch }}-musl
          path: |
            target/${{ matrix.target }}/release/kixdns-panel-server
            target/${{ matrix.target }}/release/kixdns-panel-helper
          if-no-files-found: error
          retention-days: 7

  # OpenWrt 安装包：build-musl 编的面板和服务助手、musl 内核、前端、GeoSite、procd init 脚本和在线更新器，按
  # scripts/package-openwrt.sh 拼好（本机也能跑同一个脚本）。发布正式版时和 systemd 的包一起进 Release，OpenWrt 上的面板
  # 在线更新取的就是它。PR 上也拼一遍，打包坏了合并前就知道
  # The OpenWrt package: the panel and service helper build-musl built, the musl kernel, the web console, GeoSite, the
  # procd init scripts and the online updater, put together by scripts/package-openwrt.sh (which also runs locally). A
  # stable release carries it next to the systemd packages, and the panel's online update on OpenWrt takes it from there.
  # Pull requests package it too, so a broken package shows before the merge
  package-openwrt:
    name: Package OpenWrt ${{ matrix.arch }}
    needs: [kernel, geosite, build-musl]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Download musl panel programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kixdns-panel-linux-${{ matrix.arch }}-musl
          path: dist/musl

      - name: Fetch verified musl kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          KIXDNS_KERNEL_VERSION: ${{ needs.kernel.outputs.version }}
        run: |
          bash scripts/fetch-kixdns-release.sh \
            "$KIXDNS_KERNEL_REPOSITORY" "$KIXDNS_KERNEL_VERSION" "${{ matrix.arch }}" dist/kernel-musl musl

      - name: Fetch built-in GeoSite
        env:
          GH_TOKEN: ${{ github.token }}
          GEOSITE_RELEASE: ${{ needs.geosite.outputs.release }}
        run: bash scripts/fetch-builtin-geosite.sh "$GEOSITE_RELEASE" dist/builtin-geo

      - name: Package for OpenWrt
        env:
          PANEL_BUILD_COMMIT: ${{ github.sha }}
          PANEL_RELEASE: ${{ github.event_name == 'release' && github.ref_name || '' }}
        run: |
          bash scripts/package-openwrt.sh "${{ matrix.arch }}" dist/musl dist/kernel-musl \
            dist/builtin-geo web/dist dist

      - name: Upload OpenWrt package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-openwrt-${{ matrix.arch }}
          path: dist/kixdns-panel-openwrt-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Stage OpenWrt release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixdns-panel-release-openwrt-${{ matrix.arch }}
          path: dist/kixdns-panel-openwrt-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # OpenWrt 安装包的验收：在 OpenWrt 官方的 rootfs 容器里（procd 当 1 号进程），用刚打的包把安装、在面板里启停内核
  # （接管和交还 53 端口）、在线更新、装到一半失败的回滚、卸载和重装走一遍（scripts/test-openwrt-package.sh）。两个架构各在
  # 原生 runner 上跑，各测当前和上一个稳定版；镜像按每个架构自己的 manifest digest 固定。不过就不发布
  # Acceptance of the OpenWrt package: inside OpenWrt's official rootfs container (procd as PID 1) the package just built goes
  # through install, starting and stopping the kernel from the panel (port 53 taken over and given back), the online
  # update, a rollback of a failure halfway, uninstall and reinstall (scripts/test-openwrt-package.sh). Each architecture
  # runs on a native runner against the current and the previous stable release; images are pinned by each
  # architecture's own manifest digest. No release is published without it
  openwrt-acceptance:
    name: Accept OpenWrt ${{ matrix.arch }} on ${{ matrix.release }}
    needs: package-openwrt
    runs-on: ${{ matrix.runner }}
    # 平时一分半钟；容器里有东西卡住时不要挂到 GitHub 的六小时上限 / Usually a minute and a half; something stuck in the
    # container must not hang on until GitHub's six-hour limit
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            release: "25.12.6"
            runner: ubuntu-24.04
            image: openwrt/rootfs:x86-64-25.12.6@sha256:14401c04218c2e0da0448f099710ada2460636a92395f353351cc616cf3f67af
          - arch: x86_64
            release: "24.10.8"
            runner: ubuntu-24.04
            image: openwrt/rootfs:x86-64-24.10.8@sha256:62b8bdaa417736a93cc770e5015118612f0b1c62385b1ae6e838af4357b225c4
          - arch: arm64
            release: "25.12.6"
            runner: ubuntu-24.04-arm
            image: openwrt/rootfs:armsr-armv8-25.12.6@sha256:22f13387da208c0fb4150c41f3ec12e34cc5994a0717a49e50aa9f9ae6cb5e7b
          - arch: arm64
            release: "24.10.8"
            runner: ubuntu-24.04-arm
            image: openwrt/rootfs:armsr-armv8-24.10.8@sha256:f6dd33c1d9b7d6f1e0848f2fbb92b8d03fc9b425dc08c3574a44936b93133704
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download OpenWrt package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kixdns-panel-openwrt-${{ matrix.arch }}
          path: dist

      - name: Accept the package in an OpenWrt container
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE: dist/kixdns-panel-openwrt-${{ matrix.arch }}.tar.gz
        run: bash scripts/test-openwrt-package.sh "$PACKAGE" "$IMAGE"

  # 容器镜像的验收：镜像里的程序、内核、前端和 GeoSite 都取自上面的 OpenWrt 安装包（scripts/package-docker.sh），两个架构各在
  # 原生 runner 上构建，用 scripts/test-docker-image.sh 走一遍：搬来的配置、建管理员、低端口解析、保存配置、经面板重启停止内核、
  # 重建容器以后数据都在、桥接网络。PR 上也跑：本机没有 Docker，这里是唯一跑得起容器的地方。不过就不发布
  # Acceptance of the container image: the programs, kernel, web console and GeoSite in the image all come from the OpenWrt
  # package above (scripts/package-docker.sh); each architecture is built on a native runner and walked through
  # scripts/test-docker-image.sh: a config brought over, the administrator, answers on a low port, saving a config,
  # restarting and stopping the kernel from the panel, data surviving a rebuilt container, and bridge networking. It runs
  # on pull requests too, as this is the only place containers run. No release is published without it
  docker-acceptance:
    name: Accept Docker image ${{ matrix.arch }}
    needs: package-openwrt
    runs-on: ${{ matrix.runner }}
    # 平时不到一分钟，理由同上面 OpenWrt 的验收 / Usually under a minute; same reason as the OpenWrt acceptance above
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download OpenWrt package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kixdns-panel-openwrt-${{ matrix.arch }}
          path: dist

      - name: Build the image
        run: |
          bash scripts/package-docker.sh dist/docker "dist/kixdns-panel-openwrt-${{ matrix.arch }}.tar.gz"
          docker build -f deploy/docker/Dockerfile -t kixdns-panel:acceptance dist/docker

      - name: Accept the image
        run: bash scripts/test-docker-image.sh kixdns-panel:acceptance "dist/kixdns-panel-openwrt-${{ matrix.arch }}.tar.gz"

  acceptance:
    name: Accept packaged installation
    # 推到 main 时 e2e 被跳过，「跳过」会顺着依赖往下传：不写 !cancelled()、只看 build 的结果的话，build 照常构建了，
    # 这里却跟着被跳过，每次推到 main 的安装验收就没了。publish 同理
    # On pushes to main e2e is skipped, and a skip travels down the needs chain: without !cancelled() and a check on
    # build's own result this job is skipped even though build ran, losing the install acceptance on every push to
    # main. The same holds for publish
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: build
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Download x86_64 panel package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kixdns-panel-linux-x86_64
          path: dist/kixdns-panel

      - name: Verify package installation and runtime
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            bash dist/kixdns-panel/scripts/test-package-acceptance.sh

  publish:
    name: Publish panel release
    if: >-
      !cancelled() && github.event_name == 'release'
      && needs.build.result == 'success' && needs.acceptance.result == 'success'
      && needs.package-openwrt.result == 'success' && needs.openwrt-acceptance.result == 'success'
      && needs.docker-acceptance.result == 'success'
    needs: [build, acceptance, package-openwrt, openwrt-acceptance, docker-acceptance]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kixdns-panel-release-*
          path: dist
          merge-multiple: true

      - name: Upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # systemd 的两个 zip 和 OpenWrt 的两个 tar.gz / The two systemd zips and the two OpenWrt tar.gz files
          packages=(dist/*.zip dist/*.tar.gz)
          [[ ${#packages[@]} -eq 4 ]]
          gh release upload "${GITHUB_REF_NAME}" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # 发布正式版时把两个架构的镜像推到 GHCR，标签是版本号、主次版本和 latest。镜像和 Release 的资产来自同一份 OpenWrt 安装包，
  # 资产传好了才推。第一次推上去的包默认是私有的，要在 GitHub 的包设置里改成公开
  # A stable release pushes the image for both architectures to GHCR, tagged with the version, the major.minor and latest.
  # The image and the release assets come from the same OpenWrt packages, and the push waits for the assets. A package
  # pushed for the first time is private, to be made public in its GitHub package settings
  publish-image:
    name: Publish Docker image
    if: >-
      !cancelled() && github.event_name == 'release' && needs.publish.result == 'success'
    needs: publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download OpenWrt packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kixdns-panel-openwrt-*
          path: dist
          merge-multiple: true

      - name: Build and push the image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          bash scripts/package-docker.sh dist/docker \
            dist/kixdns-panel-openwrt-x86_64.tar.gz dist/kixdns-panel-openwrt-arm64.tar.gz
          version="${GITHUB_REF_NAME#v}"
          [[ ${version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          # 默认的 docker 驱动建不了多架构镜像 / The default docker driver cannot build multi-architecture images
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/Dockerfile \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${version}" \
            -t "${image}:${version}" -t "${image}:${version%.*}" -t "${image}:latest" --push dist/docker
