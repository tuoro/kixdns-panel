name: Build enhanced KixDNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-enhanced.yml"
      - "patches/**"
      - "tools/xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "upstream.lock.json"
  pull_request:
    paths:
      - ".github/workflows/build-enhanced.yml"
      - "patches/**"
      - "tools/xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "upstream.lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify patch set
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .upstream/* -> target

      - name: Prepare enhanced source
        shell: bash
        run: |
          cargo xtask prepare
          echo "UPSTREAM_DIR=.upstream/kixdns-$(jq -r .commit upstream.lock.json | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Verify enhanced source
        run: |
          cd "$UPSTREAM_DIR"
          cargo fmt --check
          cargo test --lib --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout panel repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare enhanced source
        shell: bash
        run: |
          cargo xtask prepare
          echo "UPSTREAM_DIR=.upstream/kixdns-$(jq -r .commit upstream.lock.json | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Export build identity
        shell: bash
        run: |
          echo "KIXDNS_UPSTREAM_COMMIT=$(jq -r .commit upstream.lock.json)" >> "$GITHUB_ENV"
          echo "KIXDNS_PANEL_PATCHSET=$(jq -r .patchset upstream.lock.json)" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --manifest-path "$UPSTREAM_DIR/Cargo.toml" --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          install -Dm755 "$UPSTREAM_DIR/target/${{ matrix.target }}/release/kixdns" \
            "dist/kixdns-enhanced-linux-${{ matrix.arch }}/kixdns"
          cp upstream.lock.json "dist/kixdns-enhanced-linux-${{ matrix.arch }}/"
          cp docs/control-protocol-v1.md "dist/kixdns-enhanced-linux-${{ matrix.arch }}/"
          sha256sum "dist/kixdns-enhanced-linux-${{ matrix.arch }}/kixdns" \
            > "dist/kixdns-enhanced-linux-${{ matrix.arch }}/SHA256SUMS"

      - name: Upload enhanced artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-enhanced-linux-${{ matrix.arch }}
          path: dist/kixdns-enhanced-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
