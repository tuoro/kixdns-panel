name: Build enhanced KixDNS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify panel and patch set
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .upstream/* -> target

      - name: Verify panel server
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify web console
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build

      - name: Verify deployment scripts
        run: shellcheck scripts/*.sh

      - name: Prepare enhanced source
        shell: bash
        run: |
          cargo xtask prepare
          echo "UPSTREAM_DIR=.upstream/kixdns-$(jq -r .commit upstream.lock.json | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Verify enhanced source
        run: |
          cd "$UPSTREAM_DIR"
          cargo fmt --check
          cargo test --lib --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout panel repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Prepare enhanced source
        shell: bash
        run: |
          cargo xtask prepare
          echo "UPSTREAM_DIR=.upstream/kixdns-$(jq -r .commit upstream.lock.json | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Export build identity
        shell: bash
        run: |
          echo "KIXDNS_UPSTREAM_COMMIT=$(jq -r .commit upstream.lock.json)" >> "$GITHUB_ENV"
          echo "KIXDNS_PANEL_PATCHSET=$(jq -r .patchset upstream.lock.json)" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --manifest-path "$UPSTREAM_DIR/Cargo.toml" --release --locked --target ${{ matrix.target }}
          cargo build --package kixdns-panel-server --release --locked --target ${{ matrix.target }}

      - name: Package enhanced update artifact
        shell: bash
        run: |
          enhanced="dist/kixdns-enhanced-linux-${{ matrix.arch }}"
          install -Dm755 "$UPSTREAM_DIR/target/${{ matrix.target }}/release/kixdns" "$enhanced/kixdns"
          cp upstream.lock.json "$enhanced/"
          cp docs/control-protocol-v1.md "$enhanced/"
          (cd "$enhanced" && sha256sum kixdns > SHA256SUMS)

      - name: Package complete panel artifact
        shell: bash
        run: |
          bundle="dist/kixdns-panel-linux-${{ matrix.arch }}"
          install -Dm755 "$UPSTREAM_DIR/target/${{ matrix.target }}/release/kixdns" "$bundle/bin/kixdns"
          install -Dm755 "target/${{ matrix.target }}/release/kixdns-panel-server" "$bundle/bin/kixdns-panel-server"
          mkdir -p "$bundle/web" "$bundle/docs"
          cp -a web/dist/. "$bundle/web/"
          cp -a deploy scripts "$bundle/"
          cp docs/architecture.md docs/control-protocol-v1.md docs/deployment.md "$bundle/docs/"
          cp README.md LICENSE upstream.lock.json "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/BUILD_COMMIT"
          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload enhanced update artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-enhanced-linux-${{ matrix.arch }}
          path: dist/kixdns-enhanced-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete panel artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-panel-linux-${{ matrix.arch }}
          path: dist/kixdns-panel-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
