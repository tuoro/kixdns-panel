name: Track successful upstream versions

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-kixdns-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Validate upstream ${{ matrix.track }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        track: [action, release]
    env:
      GH_TOKEN: ${{ github.token }}
      TRACK: ${{ matrix.track }}
    steps:
      # 取分支最新提交而不是触发时的提交：两条轨道依次运行，后一条要看到前一条刚合并的变更。
      # Check out the branch tip rather than the triggering commit: the tracks run one after
      # the other, and the second must see what the first just merged.
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Record checked-out commit
        shell: bash
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify patchset catalog
        run: bash scripts/verify-patchsets.sh

      - name: Verify upstream Action selection
        run: bash scripts/test-select-kixdns-action-run.sh

      - name: Verify sync workflow steps
        run: python3 scripts/test-sync-upstream.py

      - name: Read latest upstream track
        id: upstream
        shell: bash
        run: |
          case "$TRACK" in
            action)
              response="$(gh api 'repos/olicesx/kixdns/actions/workflows/build.yml/runs?branch=main&status=success&per_page=30')"
              selection="$(bash scripts/select-kixdns-action-run.sh upstream.lock.json <<< "$response")"
              IFS=$'\t' read -r reference commit changed <<< "$selection"
              current="$(jq -r .commit upstream.lock.json)"
              lock_file='upstream.lock.json'
              label='Action'
              source_url="https://github.com/olicesx/kixdns/actions/runs/${reference}"
              ;;
            release)
              response="$(gh api 'repos/olicesx/kixdns/releases/latest')"
              reference="$(jq -r '.tag_name // empty' <<< "$response")"
              release_id="$(jq -r '.id // empty' <<< "$response")"
              commit="$(gh api "repos/olicesx/kixdns/commits/${reference}" --jq .sha)"
              current="$(jq -r .commit upstream.release.lock.json)"
              lock_file='upstream.release.lock.json'
              label='Release'
              source_url="https://github.com/olicesx/kixdns/releases/tag/${reference}"
              [[ "$commit" =~ ^[0-9a-f]{40}$ && "$release_id" =~ ^[0-9]+$ ]] || {
                echo '官方 Release 元数据无效' >&2
                exit 1
              }
              [[ "$reference" =~ ^[A-Za-z0-9._-]+$ ]] || {
                echo '官方 Release 标签无效' >&2
                exit 1
              }
              echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
              changed=false
              [[ "$commit" == "$current" ]] || changed=true
              ;;
            *)
              echo "不支持的上游轨道：${TRACK}" >&2
              exit 1
              ;;
          esac

          {
            echo "changed=$changed"
            echo "commit=$commit"
            echo "current=$current"
            echo "reference=$reference"
            echo "lock_file=$lock_file"
            echo "label=$label"
            echo "source_url=$source_url"
          } >> "$GITHUB_OUTPUT"

          if [[ "$TRACK" == action && "$changed" == true ]]; then
            comparison="$(gh api "repos/olicesx/kixdns/compare/${current}...${commit}" --jq .status)"
            if [[ "$comparison" != ahead ]]; then
              echo 'failure_kind=source' >> "$GITHUB_OUTPUT"
              echo "拒绝非快进的上游 Action 候选：${current} -> ${commit} (${comparison})" >&2
              exit 1
            fi
          fi

      - name: Prepare candidate lock
        if: steps.upstream.outputs.changed == 'true'
        env:
          CANDIDATE_COMMIT: ${{ steps.upstream.outputs.commit }}
          CANDIDATE_REFERENCE: ${{ steps.upstream.outputs.reference }}
          RELEASE_ID: ${{ steps.upstream.outputs.release_id }}
        shell: bash
        # 依赖修订属于旧版本，新候选先用补丁集自己的 Cargo.lock。
        # A dependency revision belongs to the old version; a new candidate starts
        # from the patchset's own Cargo.lock.
        run: |
          case "$TRACK" in
            action)
              jq --arg commit "$CANDIDATE_COMMIT" --argjson run_id "$CANDIDATE_REFERENCE" \
                '.commit = $commit | .official_run_id = $run_id | del(.dependency_revision)' \
                upstream.lock.json > upstream.lock.json.new
              mv upstream.lock.json.new upstream.lock.json
              ;;
            release)
              jq --arg commit "$CANDIDATE_COMMIT" --argjson release_id "$RELEASE_ID" \
                --arg tag "$CANDIDATE_REFERENCE" \
                '.commit = $commit | .release_id = $release_id | .release_tag = $tag | del(.dependency_revision)' \
                upstream.release.lock.json > upstream.release.lock.json.new
              mv upstream.release.lock.json.new upstream.release.lock.json
              ;;
          esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # 预编译包替代约 2 分 45 秒的源码编译，版本不变并校验 SHA-256；缺预编译包时直接失败。
      # A prebuilt binary replaces the ~2m45s source build at the same version with its SHA-256 checked;
      # a missing prebuilt fails instead of falling back to compiling.
      - name: Install dependency auditor
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Fetch RustSec advisory database
        shell: bash
        run: |
          advisory_db="$RUNNER_TEMP/rustsec-advisory-db"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$advisory_db"
          echo "ADVISORY_DB=$advisory_db" >> "$GITHUB_ENV"

      - name: Try current patchset
        id: prepare
        continue-on-error: true
        if: steps.upstream.outputs.changed == 'true'
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          validation_log="$RUNNER_TEMP/kixdns-compatibility-validation.log"
          : > "$validation_log"
          attempt() {
            # xtask audit 先准备增强源码，再按统一规则审计。
            # xtask audit prepares the enhanced source, then audits it under the shared rules.
            cargo xtask audit --lock "$LOCK_FILE" --advisory-db "$ADVISORY_DB" 2>&1 |
              tee -a "$validation_log"
            return "${PIPESTATUS[0]}"
          }
          # 新 Release 从上游 main 切出，而 Action 轨道天天跟着 main，它的补丁集离新版本最近，先试它。
          # 不成再用 Release 自己的补丁集，最后才交给自动重基。
          # A new release is cut from upstream main, which the action track follows daily, so its
          # patchset is the closest to the new version and goes first. The release's own patchset
          # comes next, and the automatic rebase last.
          if [[ "$TRACK" == release ]]; then
            own_lock="$RUNNER_TEMP/release-candidate.json"
            cp "$LOCK_FILE" "$own_lock"
            jq --slurpfile action upstream.lock.json '
              .patchset = $action[0].patchset
              | if $action[0].compatibility then .compatibility = $action[0].compatibility
                else del(.compatibility) end
            ' "$own_lock" > "$LOCK_FILE"
            if ! cmp -s "$own_lock" "$LOCK_FILE"; then
              if attempt; then
                exit 0
              fi
              cp "$own_lock" "$LOCK_FILE"
            fi
          fi
          attempt

      - name: Rebase overlay automatically
        id: rebase
        if: >-
          steps.upstream.outputs.changed == 'true' &&
          steps.prepare.outcome == 'failure'
        env:
          BASE_COMMIT: ${{ steps.upstream.outputs.current }}
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          validation_log="$RUNNER_TEMP/kixdns-compatibility-validation.log"
          set +e
          (
            set -euo pipefail
            cargo xtask rebase --lock "$LOCK_FILE" --base-commit "$BASE_COMMIT"
            cargo xtask prepare --lock "$LOCK_FILE"
            bash scripts/verify-patchsets.sh "$BASE_SHA"
            git diff --check
          ) 2>&1 | tee -a "$validation_log"
          status=${PIPESTATUS[0]}
          set -e
          if ((status != 0)); then
            if grep -Eq 'overlay 自动重基存在代码冲突|重新解析 Cargo.lock 失败' "$validation_log"; then
              echo 'failure_kind=conflict' >> "$GITHUB_OUTPUT"
            else
              echo 'failure_kind=infrastructure' >> "$GITHUB_OUTPUT"
            fi
            exit "$status"
          fi
          echo 'generated=true' >> "$GITHUB_OUTPUT"

      # 上游没动时照样审计当前版本：新公告随时会出，修复不必等上游。
      # With upstream unchanged the current version is still audited: advisories land at any
      # time, and the fix does not have to wait for upstream.
      - name: Audit current version
        id: audit
        if: steps.upstream.outputs.changed == 'false'
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          set +e
          cargo xtask audit --lock "$LOCK_FILE" --advisory-db "$ADVISORY_DB"
          status=$?
          set -e
          case "$status" in
            0) echo 'refresh=false' >> "$GITHUB_OUTPUT" ;;
            3) echo 'refresh=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Refresh dependencies
        id: refresh
        if: steps.audit.outputs.refresh == 'true'
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          validation_log="$RUNNER_TEMP/kixdns-security-validation.log"
          set +e
          (
            set -euo pipefail
            cargo xtask refresh-dependencies --lock "$LOCK_FILE" --advisory-db "$ADVISORY_DB"
            git diff --quiet -- "$LOCK_FILE" && {
              echo '依赖刷新没有生成新的修订' >&2
              exit 1
            }
            cargo xtask prepare --lock "$LOCK_FILE"
            bash scripts/verify-patchsets.sh "$BASE_SHA"
            git diff --check
          ) 2>&1 | tee "$validation_log"
          status=${PIPESTATUS[0]}
          set -e
          if ((status != 0)); then
            if grep -q '依赖无法在兼容版本内修复' "$validation_log"; then
              echo 'failure_kind=advisory' >> "$GITHUB_OUTPUT"
            fi
            exit "$status"
          fi
          echo 'generated=true' >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r .dependency_revision "$LOCK_FILE")" >> "$GITHUB_OUTPUT"

      - name: Prefetch candidate dependencies
        if: >-
          (steps.upstream.outputs.changed == 'true' &&
           (steps.prepare.outcome == 'success' || steps.rebase.outcome == 'success')) ||
          steps.refresh.outputs.generated == 'true'
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          upstream_dir="$(cargo xtask checkout-dir --lock "$LOCK_FILE")"
          cd "$upstream_dir"
          cargo fetch --locked

      - name: Validate enhanced candidate
        id: validate
        if: >-
          (steps.upstream.outputs.changed == 'true' &&
           (steps.prepare.outcome == 'success' || steps.rebase.outcome == 'success')) ||
          steps.refresh.outputs.generated == 'true'
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
          VALIDATION_LOG: ${{ steps.refresh.outputs.generated == 'true' && 'kixdns-security-validation.log' || 'kixdns-compatibility-validation.log' }}
        shell: bash
        run: |
          validation_log="$RUNNER_TEMP/$VALIDATION_LOG"
          validation_report="$RUNNER_TEMP/kixdns-validation-report.md"
          set +e
          (
            set -euo pipefail
            upstream_dir="$(cargo xtask checkout-dir --lock "$LOCK_FILE")"
            cd "$upstream_dir"
            cargo fmt --check
            cargo test --offline --lib --locked
            cargo test --offline --bin kixdns --locked
            cargo clippy --offline --all-targets --all-features --locked -- -D warnings
            (cd "$GITHUB_WORKSPACE" && cargo xtask audit --lock "$LOCK_FILE" --advisory-db "$ADVISORY_DB")
            cargo build --offline --locked
            python3 "$GITHUB_WORKSPACE/scripts/dns_smoke.py" target/debug/kixdns
          ) 2>&1 | tee -a "$validation_log"
          status=${PIPESTATUS[0]}
          set -e

          if ((status != 0)); then
            {
              echo '### 失败日志末尾'
              echo
              echo '```text'
              tail -n 100 "$validation_log"
              echo '```'
            } > "$validation_report"
            exit "$status"
          fi

      - name: Add validated version to catalog
        if: >-
          steps.upstream.outputs.changed == 'true' ||
          steps.refresh.outputs.generated == 'true'
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
          CHANGED: ${{ steps.upstream.outputs.changed }}
        shell: bash
        run: |
          reference="$(bash scripts/lock-reference.sh "$LOCK_FILE")"
          [[ "$reference" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "锁文件上游身份无效：$reference" >&2
            exit 1
          }
          mkdir -p "upstreams/${TRACK}s"
          cp "$LOCK_FILE" "upstreams/${TRACK}s/${reference}.json"
          if [[ "$TRACK" == action && "$CHANGED" == true ]]; then
            mapfile -t catalog < <(find upstreams/actions -maxdepth 1 -type f -name '*.json' -print | sort -r)
            for file in "${catalog[@]:10}"; do rm -f -- "$file"; done
          fi

      # 旧版本只保留还能通过审计的：它们的产物到期后要能重建。当前版本不参与，
      # 它由上面的依赖刷新负责，轨道因此永远至少留一个版本。
      # Older versions stay only while they pass the audit, because their artifacts must
      # be rebuildable after expiry. The current version is exempt; the dependency refresh
      # above looks after it, so a track never loses its last entry.
      - name: Prune versions that fail the audit
        id: prune
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          current="$(bash scripts/lock-reference.sh "$LOCK_FILE")"
          pruned=()
          while IFS= read -r entry; do
            [[ "$(basename "$entry" .json)" == "$current" ]] && continue
            set +e
            cargo xtask audit --lock "$entry" --advisory-db "$ADVISORY_DB"
            status=$?
            set -e
            case "$status" in
              0) ;;
              3)
                rm -f -- "$entry"
                pruned+=("$(basename "$entry" .json)")
                ;;
              *) echo "::warning::无法审计 ${entry}，本次保留" ;;
            esac
          done < <(find "upstreams/${TRACK}s" -maxdepth 1 -type f -name '*.json' -print | sort)
          echo "pruned=${pruned[*]}" >> "$GITHUB_OUTPUT"

      # 不再被任何锁引用的补丁集和依赖修订随之删除；最高编号的补丁集保留，编号不回退。
      # Patchsets and dependency revisions no lock references any more go with them; the
      # highest-numbered patchset stays so numbers never go backwards.
      - name: Remove unreferenced patch data
        shell: bash
        run: |
          bash scripts/remove-unreferenced-patch-data.sh
          bash scripts/verify-patchsets.sh "$BASE_SHA"

      - name: Merge validated upstream update
        id: merge
        env:
          CANDIDATE_COMMIT: ${{ steps.upstream.outputs.commit }}
          CANDIDATE_REFERENCE: ${{ steps.upstream.outputs.reference }}
          CHANGED: ${{ steps.upstream.outputs.changed }}
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
          PRUNED: ${{ steps.prune.outputs.pruned }}
          REBASED: ${{ steps.rebase.outputs.generated }}
          REFRESHED: ${{ steps.refresh.outputs.generated }}
          REVISION: ${{ steps.refresh.outputs.revision }}
          SOURCE_LABEL: ${{ steps.upstream.outputs.label }}
          SOURCE_URL: ${{ steps.upstream.outputs.source_url }}
        shell: bash
        run: |
          git add --all -- "$LOCK_FILE" "upstreams/${TRACK}s" patches
          if git diff --cached --quiet; then
            echo '没有需要合并的变更'
            exit 0
          fi
          reference="$(bash scripts/lock-reference.sh "$LOCK_FILE")"
          if [[ "$CHANGED" == true ]]; then
            branch="automation/upstream-${TRACK}-${CANDIDATE_COMMIT:0:12}"
            title="chore: track verified upstream ${TRACK}"
          elif [[ "$REFRESHED" == true ]]; then
            branch="automation/dependencies-${TRACK}-${reference}-r${REVISION}"
            title="chore: refresh ${TRACK} dependencies"
          else
            branch="automation/catalog-${TRACK}-$(date -u +%Y%m%d)"
            title="chore: prune ${TRACK} catalog"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "$title"
          git push --force origin "HEAD:refs/heads/${branch}"
          pull_request="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pull_request" ]]; then
            body_file="$RUNNER_TEMP/upstream-pull-request.md"
            {
              if [[ "$CHANGED" == true ]]; then
                echo "同步已验证的 KixDNS ${SOURCE_LABEL} 上游版本。"
                echo
                echo "- 上游身份：\`${CANDIDATE_REFERENCE}\`"
                echo "- 上游提交：\`${CANDIDATE_COMMIT}\`"
                echo "- 上游来源：${SOURCE_URL}"
                if [[ "$REBASED" == true ]]; then
                  echo "- 补丁处理：已自动重基为 p$(jq -r .patchset "$LOCK_FILE")"
                fi
                echo '- 验证：增强补丁、测试、Clippy、RustSec 与 DNS 冒烟均已通过'
              elif [[ "$REFRESHED" == true ]]; then
                echo "KixDNS ${SOURCE_LABEL} 当前版本的依赖未通过 RustSec 审计，已生成依赖修订。"
                echo
                echo "- 上游身份：\`${reference}\`"
                echo "- 依赖修订：p$(jq -r .patchset "$LOCK_FILE")-r${REVISION}"
                echo '- 验证：测试、Clippy、RustSec 与 DNS 冒烟均已通过'
              else
                echo "KixDNS ${SOURCE_LABEL} 版本目录清理。"
              fi
              if [[ -n "$PRUNED" ]]; then
                echo
                echo "未通过 RustSec 审计、移出版本目录的旧版本：\`${PRUNED// /\`、\`}\`。它们已发布的产物到期前仍可安装。"
              fi
            } > "$body_file"
            pull_request="$(gh pr create --base main --head "$branch" \
              --title "$title" --body-file "$body_file")"
          fi
          gh pr merge "$pull_request" --squash --delete-branch
          [[ "$(gh pr view "$pull_request" --json state --jq .state)" == 'MERGED' ]]
          echo 'merged=true' >> "$GITHUB_OUTPUT"

      - name: Trigger enhanced build
        if: >-
          steps.merge.outputs.merged == 'true' &&
          (steps.upstream.outputs.changed == 'true' || steps.refresh.outputs.generated == 'true')
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
        shell: bash
        run: |
          case "$TRACK" in
            action) workflow='build-kixdns.yml' ;;
            release) workflow='build-kixdns-release.yml' ;;
            *) echo "不支持的上游轨道：$TRACK" >&2; exit 1 ;;
          esac

          expected="$(jq -cS . "$LOCK_FILE")"
          for attempt in {1..10}; do
            published="$({
              gh api "repos/${GITHUB_REPOSITORY}/contents/${LOCK_FILE}?ref=main" --jq .content |
                tr -d '\n' | base64 --decode 2>/dev/null || true
            } | jq -cS . 2>/dev/null || true)"
            if [[ "$published" == "$expected" ]]; then
              echo "main 锁文件已在第 ${attempt} 次检查可见"
              break
            fi
            sleep 2
          done

          [[ "$published" == "$expected" ]] || {
            echo "main 尚未发布候选锁文件：$LOCK_FILE" >&2
            exit 1
          }
          gh workflow run "$workflow" --ref main

      - name: Report compatibility failure
        if: >-
          always() &&
          (steps.upstream.outputs.failure_kind == 'source' ||
           steps.rebase.outputs.failure_kind == 'conflict' ||
           (steps.upstream.outputs.changed == 'true' && steps.validate.outcome == 'failure'))
        env:
          CANDIDATE_COMMIT: ${{ steps.upstream.outputs.commit }}
          CANDIDATE_REFERENCE: ${{ steps.upstream.outputs.reference }}
          SOURCE_LABEL: ${{ steps.upstream.outputs.label }}
          SOURCE_URL: ${{ steps.upstream.outputs.source_url }}
        shell: bash
        run: |
          title="[compat] KixDNS ${SOURCE_LABEL} 需要适配"
          marker="<!-- kixdns-upstream-compatibility:${TRACK} -->"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$RUNNER_TEMP/kixdns-compatibility-issue.md"
          report_file="$RUNNER_TEMP/kixdns-validation-report.md"
          {
            echo "$marker"
            echo '## 上游兼容性验证失败'
            echo
            echo "- 轨道：${SOURCE_LABEL}"
            echo "- 候选身份：\`${CANDIDATE_REFERENCE}\`"
            echo "- 上游提交：\`${CANDIDATE_COMMIT}\`"
            echo "- 上游来源：${SOURCE_URL}"
            echo "- 完整日志：${workflow_url}"
            echo
            echo '该候选不会写入版本目录，现有可安装版本和 Artifact 不受影响。'
            echo
            if [[ -f "$report_file" ]]; then
              cat "$report_file"
            elif [[ -f "$RUNNER_TEMP/kixdns-compatibility-validation.log" ]]; then
              echo '### 失败日志末尾'
              echo
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/kixdns-compatibility-validation.log"
              echo '```'
            else
              echo '验证步骤未生成日志摘要，请查看完整工作流日志。'
            fi
          } > "$body_file"

          issue="$(gh issue list --state open --limit 100 --json number,title | \
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --title "$title" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      # 当前版本的漏洞无法在兼容版本内修复，或刷新后验证不过：需要人工处理，绝不自动忽略公告。
      # The current version's advisory cannot be fixed within compatible versions, or the
      # refreshed version fails validation: a human decides, and no advisory is ever ignored
      # automatically.
      - name: Report security failure
        if: >-
          always() &&
          (steps.refresh.outputs.failure_kind == 'advisory' ||
           (steps.refresh.outputs.generated == 'true' && steps.validate.outcome == 'failure'))
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
          SOURCE_LABEL: ${{ steps.upstream.outputs.label }}
        shell: bash
        run: |
          title="[security] KixDNS ${SOURCE_LABEL} 依赖需要人工处理"
          marker="<!-- kixdns-dependency-security:${TRACK} -->"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$RUNNER_TEMP/kixdns-security-issue.md"
          report_file="$RUNNER_TEMP/kixdns-validation-report.md"
          reference="$(bash scripts/lock-reference.sh <(git show "HEAD:${LOCK_FILE}"))"
          {
            echo "$marker"
            echo '## 当前版本的依赖未通过 RustSec 审计，自动刷新没有解决'
            echo
            echo "- 轨道：${SOURCE_LABEL}"
            echo "- 上游身份：\`${reference}\`"
            echo "- 完整日志：${workflow_url}"
            echo
            echo '修复需要跨不兼容版本升级或改动代码。已发布的产物不受影响，但到期后无法重建。'
            echo
            if [[ -f "$report_file" ]]; then
              cat "$report_file"
            else
              echo '### 失败日志末尾'
              echo
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/kixdns-security-validation.log"
              echo '```'
            fi
          } > "$body_file"

          issue="$(gh issue list --state open --limit 100 --json number,title | \
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --title "$title" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Close resolved compatibility alert
        if: >-
          success() &&
          steps.upstream.outputs.changed == 'true' &&
          steps.merge.outputs.merged == 'true'
        env:
          SOURCE_LABEL: ${{ steps.upstream.outputs.label }}
        shell: bash
        run: |
          title="[compat] KixDNS ${SOURCE_LABEL} 需要适配"
          issue="$(gh issue list --state open --limit 100 --json number,title | \
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment '对应轨道已通过兼容性验证，告警自动关闭。'
          fi

      - name: Close resolved security alert
        if: >-
          success() &&
          (steps.audit.outputs.refresh == 'false' ||
           steps.merge.outputs.merged == 'true')
        env:
          SOURCE_LABEL: ${{ steps.upstream.outputs.label }}
        shell: bash
        run: |
          title="[security] KixDNS ${SOURCE_LABEL} 依赖需要人工处理"
          issue="$(gh issue list --state open --limit 100 --json number,title | \
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment '当前版本已通过 RustSec 审计，告警自动关闭。'
          fi

      # 无人维护或提示类公告不阻断构建，但要让人知道：列在一个 Issue 里，消失后自动关闭。
      # Unmaintained and informational advisories never block a build, but someone should
      # know: they are listed in one issue, which closes once they are gone.
      - name: Report dependency notices
        if: success()
        env:
          LOCK_FILE: ${{ steps.upstream.outputs.lock_file }}
          SOURCE_LABEL: ${{ steps.upstream.outputs.label }}
        shell: bash
        run: |
          notices="$RUNNER_TEMP/kixdns-dependency-notices.md"
          cargo xtask audit --lock "$LOCK_FILE" --advisory-db "$ADVISORY_DB" --notices "$notices"
          title="[notice] KixDNS ${SOURCE_LABEL} 依赖提示"
          issue="$(gh issue list --state open --limit 100 --json number,title | \
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ ! -s "$notices" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment '当前版本已没有无人维护或提示类依赖公告，告警自动关闭。'
            fi
            exit 0
          fi
          reference="$(bash scripts/lock-reference.sh "$LOCK_FILE")"
          body_file="$RUNNER_TEMP/kixdns-notice-issue.md"
          {
            echo "<!-- kixdns-dependency-notice:${TRACK} -->"
            echo '## 当前版本有依赖被标为无人维护或有提示'
            echo
            echo "- 轨道：${SOURCE_LABEL}"
            echo "- 上游身份：\`${reference}\`"
            echo
            echo "这些公告没有修复版本，不阻断构建；长期需要上游换掉这些库。出现真正的漏洞时会另开 \`[security]\` 告警。"
            echo
            cat "$notices"
          } > "$body_file"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --title "$title" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
