name: Track successful upstream action

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-kixdns-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Validate latest successful upstream commit
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Read latest successful official action
        id: upstream
        shell: bash
        run: |
          response="$(gh api 'repos/olicesx/kixdns/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1')"
          commit="$(jq -r '.workflow_runs[0].head_sha // empty' <<< "$response")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<< "$response")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo '官方 Action 未返回完整提交 SHA' >&2; exit 1; }
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '官方 Action 未返回 run id' >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "current=$(jq -r .commit upstream.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Ensure current lock has a successful build
        if: steps.upstream.outputs.commit == steps.upstream.outputs.current
        shell: bash
        run: |
          lock_updated_at="$(git log -1 --format=%ct -- upstream.lock.json)"
          latest_build_at="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/build-kixdns.yml/runs" \
              -f branch=main -f status=success -f per_page=20 \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].created_at // empty'
          )"
          if [[ -z "$latest_build_at" ]] || (( $(date -d "$latest_build_at" +%s) < lock_updated_at )); then
            gh workflow run build-kixdns.yml --ref main
            echo "当前锁定缺少成功 Artifact，已重新派发增强构建"
          else
            echo "上游锁定和增强 Artifact 均为最新"
          fi

      - name: Update lock file
        if: steps.upstream.outputs.commit != steps.upstream.outputs.current
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          RUN_ID: ${{ steps.upstream.outputs.run_id }}
        run: |
          jq --arg commit "$COMMIT" --argjson run_id "$RUN_ID" \
            '.commit = $commit | .official_run_id = $run_id' upstream.lock.json > upstream.lock.json.new
          mv upstream.lock.json.new upstream.lock.json

      - name: Validate patch compatibility
        if: steps.upstream.outputs.commit != steps.upstream.outputs.current
        shell: bash
        run: |
          cargo xtask prepare
          upstream_dir=".upstream/kixdns-$(jq -r .commit upstream.lock.json | cut -c1-12)-p$(jq -r .patchset upstream.lock.json)"
          cd "$upstream_dir"
          cargo fmt --check
          cargo test --lib --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo audit --deny warnings
          cargo build --locked
          python3 "$GITHUB_WORKSPACE/scripts/dns_smoke.py" target/debug/kixdns

      - name: Merge validated upstream update
        if: steps.upstream.outputs.commit != steps.upstream.outputs.current
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          RUN_ID: ${{ steps.upstream.outputs.run_id }}
        shell: bash
        run: |
          short="${COMMIT:0:12}"
          branch="automation/upstream-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream.lock.json
          git commit -m "chore: track upstream ${short}"
          git push --force origin "HEAD:refs/heads/${branch}"
          pull_request="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pull_request" ]]; then
            body="$(printf '锁定 KixDNS 官方 build.yml 最近成功 Action 的提交。\n\n- commit: `%s`\n- run: https://github.com/olicesx/kixdns/actions/runs/%s\n- 增强补丁、测试和 Clippy 已通过' "$COMMIT" "$RUN_ID")"
            pull_request="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: track successful upstream ${short}" \
              --body "$body")"
          fi
          gh pr merge "$pull_request" --squash --delete-branch
          [[ "$(gh pr view "$pull_request" --json state --jq .state)" == 'MERGED' ]]
          gh workflow run build-kixdns.yml --ref main
