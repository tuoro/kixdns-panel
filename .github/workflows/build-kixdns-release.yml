name: Build KixDNS Enhanced from Release

on:
  schedule:
    - cron: "43 4 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/build-kixdns-release.yml
      - .github/workflows/build-kixdns-track.yml
      - patches/**
      - scripts/dns_smoke.py
      - scripts/verify-patchsets.sh
      - tools/xtask/**
      - Cargo.lock
      - scripts/kixdns-artifact-identity.sh
      - scripts/test-kixdns-artifact-identity.sh
      - upstreams/releases/**
      - upstream.release.lock.json
      - rust-toolchain.toml
  pull_request:
    paths:
      - .github/workflows/build-kixdns-release.yml
      - .github/workflows/build-kixdns-track.yml
      - patches/**
      - scripts/dns_smoke.py
      - scripts/verify-patchsets.sh
      - tools/xtask/**
      - Cargo.lock
      - scripts/kixdns-artifact-identity.sh
      - scripts/test-kixdns-artifact-identity.sh
      - upstreams/releases/**
      - upstream.release.lock.json
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all catalog versions
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: kixdns-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-kixdns-track.yml
    with:
      catalog_directory: upstreams/releases
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
